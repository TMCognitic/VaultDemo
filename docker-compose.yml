name: "VaultDemo"
services:
  vault:
    container_name: vault
    image: hashicorp/vault:2.2
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-demo
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports:
      - 8200:8200
    volumes:
      - ./HashiCorp/logs:/vault/logs
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 15

  vault-init:
    container_name: vault-init
    image: hashicorp/vault:2.2
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root-demo
    volumes:
      - ./HashiCorp/init:/init:ro
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"
